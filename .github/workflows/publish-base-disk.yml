name: Import ServerKing base disk

on:
  workflow_dispatch:
    inputs:
      disk_name:
        description: Cozystack VMDisk name
        required: true
        default: nixos-26-05-v1
      image_url:
        description: Public qcow2 URL, typically a GitHub Release asset
        required: true
      storage:
        description: Base disk size
        required: true
        default: 10Gi

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SERVERKING_NAMESPACE: ${{ vars.SERVERKING_NAMESPACE || 'tenant-u665' }}
      SERVERKING_STORAGE_CLASS: ${{ vars.SERVERKING_STORAGE_CLASS || 'replicated2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create ServerKing kubeconfig
        env:
          SERVERKING_TOKEN: ${{ secrets.SERVERKING_TOKEN }}
          SERVERKING_CA_B64: ${{ secrets.SERVERKING_CA_B64 }}
        run: |
          set -euo pipefail
          KUBECONFIG_PATH="$(./scripts/write-ci-kubeconfig "$RUNNER_TEMP/serverking-kubeconfig")"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify tenant API access
        run: ./scripts/serverking-auth-check

      - name: Import base VMDisk
        run: ./scripts/import-base-disk "${{ inputs.disk_name }}" "${{ inputs.image_url }}" "${{ inputs.storage }}"
