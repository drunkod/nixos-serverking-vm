name: Build NixOS golden image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "common.nix"
      - "image.nix"
      - ".github/workflows/build-image.yml"
  push:
    tags:
      - "image-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate image
        run: |
          nix eval .#packages.x86_64-linux.serverking-image.drvPath
          nix eval .#nixosConfigurations.serverking-image.config.system.build.toplevel.drvPath

      - name: Build 10 GiB qcow2
        run: nix build .#serverking-image --out-link result-image --print-build-logs

      - name: Validate qcow2
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          IMAGE="$(find -L result-image -type f -name '*.qcow2' | head -n1)"
          test -n "$IMAGE"
          qemu-img info "$IMAGE"
          qemu-img check "$IMAGE"
          cp -L "$IMAGE" nixos-serverking.qcow2

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-serverking-qcow2
          path: nixos-serverking.qcow2
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/image-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes nixos-serverking.qcow2
