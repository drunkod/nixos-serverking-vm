name: Build NixOS golden image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "common.nix"
      - "image.nix"
      - "scripts/write-ci-kubeconfig"
      - "scripts/import-base-disk"
      - ".github/workflows/build-image.yml"
  push:
    tags:
      - "image-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate image
        run: |
          nix eval .#packages.x86_64-linux.serverking-image.drvPath
          nix eval .#nixosConfigurations.serverking-image.config.system.build.toplevel.drvPath

      - name: Build 10 GiB qcow2
        run: nix build .#serverking-image --out-link result-image --print-build-logs

      - name: Validate qcow2
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          IMAGE="$(find -L result-image -type f -name '*.qcow2' | head -n1)"
          test -n "$IMAGE"
          qemu-img info "$IMAGE"
          qemu-img check "$IMAGE"
          cp -L "$IMAGE" nixos-serverking.qcow2

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-serverking-qcow2
          path: nixos-serverking.qcow2
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/image-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            nixos-serverking.qcow2

  import-base-disk:
    if: startsWith(github.ref, 'refs/tags/image-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVERKING_NAMESPACE: ${{ vars.SERVERKING_NAMESPACE || 'tenant-u665' }}
      SERVERKING_STORAGE_CLASS: ${{ vars.SERVERKING_STORAGE_CLASS || 'replicated2' }}
      BASE_DISK_NAME: nixos-26-05-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create ServerKing kubeconfig
        env:
          SERVERKING_TOKEN: ${{ secrets.SERVERKING_TOKEN }}
          SERVERKING_CA_B64: ${{ secrets.SERVERKING_CA_B64 }}
        run: |
          set -euo pipefail
          KUBECONFIG_PATH="$(./scripts/write-ci-kubeconfig "$RUNNER_TEMP/serverking-kubeconfig")"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verify tenant API access
        run: ./scripts/serverking-auth-check

      - name: Import released qcow2 as golden VMDisk
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE_URL="https://github.com/$GH_REPOSITORY/releases/download/$RELEASE_TAG/nixos-serverking.qcow2"
          ./scripts/import-base-disk "$BASE_DISK_NAME" "$IMAGE_URL" 10Gi
